<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JuliUs 解析ツール（非公開）</title>
    <meta name="robots" content="noindex, nofollow">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', 'Helvetica Neue', 'Arial', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Meiryo', sans-serif;
            touch-action: manipulation;
        }
        /* --- 盤面・駒（nnue-lab.html を移植） --- */
        .board {
            display: grid;
            width: 100%;
            aspect-ratio: 1 / 1;
        }
        .cell { position: relative; display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; }
        .cell.light { background-color: #f0d9b5; }
        .cell.dark { background-color: #b58863; }
        .piece { position: absolute; width: 75%; height: 75%; border-radius: 50%; cursor: pointer; transition: all 0.2s ease-in-out; box-sizing: border-box; box-shadow: inset 0 -4px 8px rgba(0,0,0,0.3), 0 2px 4px rgba(0,0,0,0.5); }
        .piece.white { background: radial-gradient(circle at 50% 30%, #ffffff, #cccccc); border: 2px solid #888; }
        .piece.black { background: radial-gradient(circle at 50% 30%, #555555, #111111); border: 2px solid #000; }
        .cell.selected { outline: 3px solid #3b82f6; outline-offset: -3px; }
        .cell.valid-move::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 30%; height: 30%; background-color: rgba(59, 130, 246, 0.7); border-radius: 50%; pointer-events: none; z-index: 10; }
        #modal { transition: opacity 0.3s ease, transform 0.3s ease; z-index: 50; }

        /* --- 評価バー --- */
        #eval-bar-track { background: #111; height: 22px; border-radius: 4px; overflow: hidden; position: relative; }
        #eval-bar-white { background: linear-gradient(90deg, #f5f5f5, #ffffff); height: 100%; transition: width 0.2s ease; }
        #eval-bar-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #111; text-shadow: 0 1px 2px rgba(255,255,255,0.6); }

        .stat-chip { background: #f3f4f6; border-radius: 6px; padding: 4px 8px; font-size: 12px; }
        .dev-badge { background: #7c3aed; color: white; font-size: 10px; padding: 2px 6px; border-radius: 9999px; letter-spacing: 0.05em; }

        /* --- 棋譜表示（game.html を移植） --- */
        .kifu-scroll {
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
            -ms-overflow-style: none;
            -webkit-mask-image: linear-gradient(to right, transparent, black 16px, black calc(100% - 16px), transparent);
            mask-image: linear-gradient(to right, transparent, black 16px, black calc(100% - 16px), transparent);
        }
        .kifu-scroll::-webkit-scrollbar { display: none; }
        #kifu-text { padding: 0 16px; }
        .kifu-move { cursor: pointer; padding: 1px 3px; }
        .kifu-move:hover { background-color: #e5e7eb; border-radius: 4px; }
        .kifu-move.kifu-active { background-color: #d1d5db; border-radius: 4px; font-weight: 700; }

        /* --- 解析パネル --- */
        .candidate-row { cursor: pointer; border: 1px solid #e5e7eb; border-radius: 6px; padding: 6px 10px; }
        .candidate-row:hover { background-color: #eff6ff; border-color: #93c5fd; }
        .candidate-row.is-win { background-color: #fef3c7; border-color: #f59e0b; }
        .win-badge { background: #f59e0b; color: white; font-size: 10px; padding: 1px 6px; border-radius: 9999px; margin-left: 6px; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <header class="bg-purple-900 text-white py-2 px-4 text-center text-sm">
        <span class="dev-badge">解析専用・非公開</span>
        JuliUs 解析ツール — gen137 による時間無制限探索・棋譜つき局面解析（Firebase 未使用・ローカルメモリのみ）
    </header>

    <main class="w-full max-w-3xl mx-auto py-6 px-4">

        <!-- ───────────── ゲーム情報パネル ───────────── -->
        <section id="info-panel" class="bg-white rounded-lg shadow-md p-4 mb-4 text-center">
            <p id="turn-indicator" class="text-xl font-semibold">-</p>
            <p id="message-area" class="text-gray-600 mt-2 h-6"></p>
            <p id="viewing-past-notice" class="text-xs text-orange-600 h-4"></p>
            <div class="flex justify-around mt-3">
                <div class="w-1/2 text-center">
                    <p class="font-semibold">白</p>
                    <p id="white-summon-count" class="text-sm">召喚 0 / 8</p>
                </div>
                <div class="w-1/2 text-center">
                    <p class="font-semibold">黒</p>
                    <p id="black-summon-count" class="text-sm">召喚 0 / 8</p>
                </div>
            </div>
        </section>

        <!-- ───────────── 盤面 ───────────── -->
        <div id="board" class="board rounded-md overflow-hidden shadow-md"></div>

        <!-- ───────────── 操作パネル ───────────── -->
        <section id="controls-panel" class="bg-white rounded-lg shadow-md p-4 mt-4">
            <div id="action-mode-toggle" class="hidden flex items-center justify-center space-x-4 mb-4">
                <label class="flex items-center cursor-pointer">
                    <input type="radio" name="actionMode" value="MOVE" class="sr-only peer" checked>
                    <span class="px-4 py-2 rounded-lg font-semibold text-gray-700 bg-gray-200 peer-checked:bg-blue-500 peer-checked:text-white">移動</span>
                </label>
                <label class="flex items-center cursor-pointer">
                    <input type="radio" name="actionMode" value="ELIMINATE" class="sr-only peer">
                    <span class="px-4 py-2 rounded-lg font-semibold text-gray-700 bg-gray-200 peer-checked:bg-red-500 peer-checked:text-white">排除</span>
                </label>
            </div>
            <div id="action-buttons" class="flex space-x-2">
                <button id="cancel-button" class="hidden w-1/2 bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-lg shadow">キャンセル</button>
                <button id="end-turn-button" class="hidden w-1/2 bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-2 px-4 rounded-lg shadow">ターン終了</button>
            </div>
        </section>

        <!-- ───────────── 棋譜表示 ───────────── -->
        <section id="kifu-section" class="bg-white rounded-lg shadow-md p-3 mt-4">
            <div id="kifu-scroll" class="kifu-scroll">
                <span id="kifu-text" class="font-mono text-sm text-gray-700"></span>
            </div>
        </section>

        <!-- ───────────── 棋譜操作パネル ───────────── -->
        <section id="replay-controls" class="bg-white rounded-lg shadow-md p-4 mt-4 flex items-center justify-center space-x-4">
            <button id="first-move-btn" class="replay-btn px-3 py-2 bg-gray-200 rounded-md hover:bg-gray-300"><i class="fas fa-fast-backward"></i></button>
            <button id="prev-move-btn" class="replay-btn px-3 py-2 bg-gray-200 rounded-md hover:bg-gray-300"><i class="fas fa-step-backward"></i></button>
            <span id="turn-display" class="font-semibold text-gray-700">Turn 0 / 0</span>
            <button id="next-move-btn" class="replay-btn px-3 py-2 bg-gray-200 rounded-md hover:bg-gray-300"><i class="fas fa-step-forward"></i></button>
            <button id="last-move-btn" class="replay-btn px-3 py-2 bg-gray-200 rounded-md hover:bg-gray-300"><i class="fas fa-fast-forward"></i></button>
            <button id="new-game-btn" class="ml-4 px-3 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md text-sm">新規（盤リセット）</button>
        </section>

        <!-- ───────────── 評価バー（常時・静的評価） ───────────── -->
        <section id="eval-panel" class="bg-white rounded-lg shadow-md p-4 mt-4">
            <p class="text-xs text-gray-500 mb-1">評価バー（白視点勝率。gen137 の静的評価。メインスレッドで随時計算）</p>
            <div id="eval-bar-track">
                <div id="eval-bar-white" style="width:50%"></div>
                <div id="eval-bar-label">読込中…</div>
            </div>
        </section>

        <!-- ───────────── 解析パネル（Phase 5） ───────────── -->
        <section id="analysis-panel" class="bg-white rounded-lg shadow-md p-4 mt-4">
            <div class="flex items-center justify-between mb-3">
                <h2 class="font-bold text-lg">局面解析（gen137・時間無制限）</h2>
                <span class="text-xs text-gray-400">モデル: gen137 固定</span>
            </div>

            <div class="flex space-x-2 mb-3">
                <button id="analyze-start-btn" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg shadow">解析開始</button>
                <button id="analyze-stop-btn" class="hidden flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg shadow">解析停止</button>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 mb-3">
                <div class="stat-chip">探索ラウンド: <span id="analysis-depth">-</span></div>
                <div class="stat-chip">経過時間: <span id="analysis-elapsed">-</span> ms</div>
                <div class="stat-chip">現局面評価値: <span id="analysis-current-score">-</span></div>
                <div class="stat-chip col-span-2 sm:col-span-1">現手番勝率: <span id="analysis-current-winprob">-</span></div>
            </div>

            <div>
                <p class="text-xs text-gray-500 mb-1">最善候補手 Top3（クリック/ホバーで盤上プレビュー）</p>
                <div id="candidates-list" class="space-y-1"></div>
            </div>
        </section>

    </main>

    <!-- モーダル（移動枚数選択などに使用） -->
    <div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 opacity-0 scale-95">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-sm text-center">
            <h2 id="modal-title" class="text-xl font-bold mb-4"></h2>
            <div id="modal-content" class="mb-6"></div>
            <div class="flex space-x-2">
                <button id="modal-cancel-button" class="hidden w-1/2 bg-gray-400 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded-lg">キャンセル</button>
                <button id="modal-button" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg w-full">OK</button>
            </div>
        </div>
    </div>

    <script type="module">
        // Firebase は一切 import しない。状態はページ内メモリだけで完結する。
        import { simulateTurn, checkWinCondition, normalizeBoard, maxSummonsFor } from './js/gameLogic.js';
        import { createNetworkFromBuffer } from './js/ai/nnue/network.js';
        import { diffToNotation } from './js/tutorial/coords.js';

        // 固定モデル（非公開・解析専用。gen137 は現行最強の学習済みNNUE（共有スタックエンコーダ））
        const ANALYSIS_NET_PATH = '/models/gen137.json';
        const BOARD_SIZE = 4; // 拡張余地として変数化しておくが、本ツールは4x4固定運用。

        // ─── 評価バー用 NNUE ネットワークのロード（メインスレッド・キャッシュ付き、nnue-lab.html 踏襲） ───
        const evalNetCache = new Map(); // path(.json) -> Promise<network>
        function loadEvalNet(jsonPath) {
            const normalized = jsonPath.replace(/\.bin$/, '.json');
            let cached = evalNetCache.get(normalized);
            if (cached) return cached;
            const jsonUrl = new URL(normalized, location.origin).href;
            const binUrl = jsonUrl.replace(/\.json$/, '.bin');
            cached = Promise.all([
                fetch(jsonUrl).then((r) => { if (!r.ok) throw new Error(`モデルJSON取得失敗: ${normalized} (${r.status})`); return r.json(); }),
                fetch(binUrl).then((r) => { if (!r.ok) throw new Error(`モデル重み取得失敗: ${binUrl} (${r.status})`); return r.arrayBuffer(); }),
            ]).then(([meta, buf]) => createNetworkFromBuffer(buf, meta));
            evalNetCache.set(normalized, cached);
            return cached;
        }

        // ───────────────────────── DOM 参照 ─────────────────────────
        const dom = {
            turnIndicator: document.getElementById('turn-indicator'),
            messageArea: document.getElementById('message-area'),
            viewingPastNotice: document.getElementById('viewing-past-notice'),
            whiteSummonCount: document.getElementById('white-summon-count'),
            blackSummonCount: document.getElementById('black-summon-count'),

            board: document.getElementById('board'),

            actionModeToggle: document.getElementById('action-mode-toggle'),
            cancelBtn: document.getElementById('cancel-button'),
            endTurnBtn: document.getElementById('end-turn-button'),

            kifuText: document.getElementById('kifu-text'),
            firstMoveBtn: document.getElementById('first-move-btn'),
            prevMoveBtn: document.getElementById('prev-move-btn'),
            nextMoveBtn: document.getElementById('next-move-btn'),
            lastMoveBtn: document.getElementById('last-move-btn'),
            turnDisplay: document.getElementById('turn-display'),
            newGameBtn: document.getElementById('new-game-btn'),

            evalBarWhite: document.getElementById('eval-bar-white'),
            evalBarLabel: document.getElementById('eval-bar-label'),

            analyzeStartBtn: document.getElementById('analyze-start-btn'),
            analyzeStopBtn: document.getElementById('analyze-stop-btn'),
            analysisDepth: document.getElementById('analysis-depth'),
            analysisElapsed: document.getElementById('analysis-elapsed'),
            analysisCurrentScore: document.getElementById('analysis-current-score'),
            analysisCurrentWinprob: document.getElementById('analysis-current-winprob'),
            candidatesList: document.getElementById('candidates-list'),

            modal: document.getElementById('modal'),
            modalTitle: document.getElementById('modal-title'),
            modalContent: document.getElementById('modal-content'),
            modalBtn: document.getElementById('modal-button'),
            modalCancelBtn: document.getElementById('modal-cancel-button'),
        };

        // ───────────────────────── UI 状態機械（nnue-lab.html を移植、両手番人間化） ─────────────────────────
        // IDLE | PIECE_SELECTED | CONTINUOUS_MOVE | ACTION_TAKEN
        class AnalysisTool {
            constructor() {
                this.boardSize = BOARD_SIZE;
                this.maxSummons = maxSummonsFor(this.boardSize);

                this.analysisWorker = new Worker('js/ai/analysisWorker.js', { type: 'module' });
                this.analysisWorker.onmessage = (event) => this.handleAnalysisMessage(event.data);
                this.analysisWorker.onerror = (err) => {
                    console.error('analysisWorker error:', err);
                    this.analyzing = false;
                    this.setMessage('解析エラーが発生しました: ' + (err.message || err));
                    this.renderAnalysisControls();
                };

                this.analysisRequestId = 0;
                this.analyzing = false;
                this.previewCandidate = null; // ホバー中のプレビュー用候補（board を一時表示）

                this.resolvedEvalNets = {};
                this._evalNetLoading = null;

                this.newGame();
                this.bindUi();
            }

            // ───────────── ゲーム初期化 ─────────────
            // moves: 各半手後の確定局面スナップショット配列。moves[0] は初期局面（白番・空盤）。
            newGame() {
                this.stopAnalysis();

                const emptyBoard = [];
                for (let r = 0; r < this.boardSize; r++) {
                    const row = [];
                    for (let c = 0; c < this.boardSize; c++) row.push(0);
                    emptyBoard.push(row);
                }

                this.moves = [{
                    board: emptyBoard,
                    summonCounts: { white: 0, black: 0 },
                    currentPlayer: 'white',
                }];
                this.viewingIndex = 0;
                this.status = 'in_progress';
                this.winner = null;
                this.winReason = null;

                this.resetUncommittedChanges();
                this.setMessage('新規解析局面を開始しました。両手番とも自分で操作できます。');
                this.render();
            }

            // 現在表示中の確定局面（moves[viewingIndex]）を返す。
            viewingState() {
                return this.moves[this.viewingIndex];
            }

            // 現在ターンの作業コピー（サモン/移動/排除を積み重ねる下書き状態）を、
            // 表示中の確定局面から作り直す（nnue-lab.html の resetUncommittedChanges 相当）。
            resetUncommittedChanges() {
                const committed = this.viewingState();
                const normalized = normalizeBoard(committed.board, this.boardSize);
                this.currentTurnState = {
                    board: normalized.map((row) => row.map((cell) => cell.slice())),
                    summonCounts: { ...committed.summonCounts },
                    currentPlayer: committed.currentPlayer,
                };
                this.turnStartBoardState = JSON.parse(JSON.stringify(this.currentTurnState.board));
                this.turnActions = [];
                this.uiGameState = 'IDLE';
                this.selectedCoords = null;
                this.lastMoveDest = null;
                this.actionMode = 'MOVE';
            }

            // ───────────── UI バインド ─────────────
            bindUi() {
                dom.newGameBtn.addEventListener('click', () => this.newGame());
                dom.board.addEventListener('click', (e) => this.handleBoardClick(e));
                dom.cancelBtn.addEventListener('click', () => this.cancelTurn());
                dom.endTurnBtn.addEventListener('click', () => this.endTurn());

                dom.actionModeToggle.querySelectorAll('input[name="actionMode"]').forEach(radio => {
                    radio.addEventListener('change', (e) => {
                        this.actionMode = e.target.value;
                        this.setMessage(this.actionMode === 'MOVE' ? '移動する駒を選択してください。' : '排除する駒のあるマスを選択してください。');
                        this.render();
                    });
                });

                dom.firstMoveBtn.addEventListener('click', () => this.jumpTo(0));
                dom.prevMoveBtn.addEventListener('click', () => this.jumpTo(this.viewingIndex - 1));
                dom.nextMoveBtn.addEventListener('click', () => this.jumpTo(this.viewingIndex + 1));
                dom.lastMoveBtn.addEventListener('click', () => this.jumpTo(this.moves.length - 1));

                dom.kifuText.addEventListener('click', (e) => {
                    const el = e.target.closest('.kifu-move');
                    if (!el) return;
                    const halfIndex = parseInt(el.dataset.halfIndex, 10);
                    if (Number.isNaN(halfIndex)) return;
                    // halfMoves[k] は moves[k+1] の局面を生んだ手に対応する。
                    this.jumpTo(halfIndex + 1);
                });

                dom.analyzeStartBtn.addEventListener('click', () => this.startAnalysis());
                dom.analyzeStopBtn.addEventListener('click', () => this.stopAnalysis());
            }

            // ───────────── 棋譜ナビゲーション（過去局面への移動） ─────────────
            jumpTo(index) {
                const clamped = Math.max(0, Math.min(this.moves.length - 1, index));
                if (clamped === this.viewingIndex) return;
                this.stopAnalysis();
                this.viewingIndex = clamped;
                this.resetUncommittedChanges();
                this.setMessage('');
                this.render();
            }

            // ───────────── 手番判定（両手番とも常に人間操作可） ─────────────
            isHumanTurn() {
                return true;
            }

            isViewingLatest() {
                return this.viewingIndex === this.moves.length - 1;
            }

            // ───────────── 盤面クリック処理（nnue-lab.html を移植） ─────────────
            handleBoardClick(e) {
                if (this.status !== 'in_progress') return;

                const cell = e.target.closest('.cell');
                if (!cell) return;

                if (this.uiGameState === 'ACTION_TAKEN') {
                    this.setMessage('ターンを終了するか、キャンセルしてください。');
                    return;
                }

                const r = parseInt(cell.dataset.r, 10);
                const c = parseInt(cell.dataset.c, 10);
                const isSummonPhaseOver = this.currentTurnState.summonCounts.white === this.maxSummons &&
                    this.currentTurnState.summonCounts.black === this.maxSummons;

                if (isSummonPhaseOver && this.actionMode === 'ELIMINATE') this.handleEliminate(r, c);
                else if (this.uiGameState === 'IDLE' || this.uiGameState === 'CONTINUOUS_MOVE') this.handleSelection(r, c);
                else if (this.uiGameState === 'PIECE_SELECTED') this.handleMoveAction(r, c);
            }

            handleSelection(r, c) {
                const { currentPlayer, summonCounts } = this.currentTurnState;
                const stack = this.currentTurnState.board[r][c];
                const isEmpty = !Array.isArray(stack) || stack.length === 0;
                const isMyPieceOnTop = !isEmpty && stack[stack.length - 1] === currentPlayer;

                if (this.uiGameState === 'CONTINUOUS_MOVE') {
                    if (this.lastMoveDest.r !== r || this.lastMoveDest.c !== c) {
                        this.setMessage('連続移動は直前の移動先から行う必要があります。');
                        return;
                    }
                    if (isMyPieceOnTop) {
                        let ownPiecesOnTop = 0;
                        for (let i = stack.length - 1; i >= 0; i--) {
                            if (stack[i] === currentPlayer) ownPiecesOnTop++;
                            else break;
                        }
                        if (ownPiecesOnTop > 1) {
                            this.selectPiece(r, c);
                        } else {
                            this.setMessage('ここからは連続移動できません。');
                        }
                    }
                    return;
                }

                if (isMyPieceOnTop) {
                    this.selectPiece(r, c);
                } else if (isEmpty && summonCounts[currentPlayer] < this.maxSummons) {
                    this.summon(r, c);
                }
            }

            handleMoveAction(r, c) {
                const isMoveValid = this.getValidMoves(this.selectedCoords.r, this.selectedCoords.c)
                    .some(m => m.r === r && m.c === c);
                if (isMoveValid) {
                    this.promptForPieceCount(this.selectedCoords.r, this.selectedCoords.c, r, c);
                } else if (this.selectedCoords.r === r && this.selectedCoords.c === c) {
                    this.deselect();
                } else {
                    this.setMessage('無効な移動先です。');
                }
            }

            summon(r, c) {
                const { currentPlayer } = this.currentTurnState;
                if (!Array.isArray(this.currentTurnState.board[r][c])) {
                    this.currentTurnState.board[r][c] = [];
                }
                this.currentTurnState.board[r][c].push(currentPlayer);
                this.currentTurnState.summonCounts[currentPlayer]++;
                this.turnActions.push({ type: 'summon', r, c });
                this.setMessage(`${currentPlayer === 'white' ? '白' : '黒'}が駒を召喚しました。`);
                this.uiGameState = 'ACTION_TAKEN';
                this.render();
            }

            move(startR, startC, endR, endC, pieceCount) {
                if (!Array.isArray(this.currentTurnState.board[endR][endC])) {
                    this.currentTurnState.board[endR][endC] = [];
                }
                const piecesToMove = this.currentTurnState.board[startR][startC].splice(-pieceCount);
                this.currentTurnState.board[endR][endC].push(...piecesToMove);
                this.turnActions.push({
                    type: 'move',
                    from: { r: startR, c: startC },
                    to: { r: endR, c: endC },
                    count: pieceCount,
                });

                if (this.currentTurnState.board[startR][startC].length === 0) {
                    this.currentTurnState.board[startR][startC] = [];
                }

                this.uiGameState = 'CONTINUOUS_MOVE';
                this.lastMoveDest = { r: endR, c: endC };
                this.selectedCoords = null;

                const { board, currentPlayer } = this.currentTurnState;
                const newStack = board[endR][endC];
                let ownPiecesOnTop = 0;
                for (let i = newStack.length - 1; i >= 0; i--) {
                    if (newStack[i] === currentPlayer) ownPiecesOnTop++;
                    else break;
                }

                if (ownPiecesOnTop > 1) {
                    this.selectPiece(endR, endC);
                } else {
                    this.uiGameState = 'CONTINUOUS_MOVE';
                    this.selectedCoords = null;
                    this.setMessage('これ以上連続移動できません。');
                    this.render();
                }
            }

            handleEliminate(r, c) {
                const { board, currentPlayer } = this.currentTurnState;
                const stack = board[r][c];
                if (!Array.isArray(stack) || stack.length === 0 || stack[stack.length - 1] !== currentPlayer) {
                    this.setMessage('自分の駒が一番上にあるマスを選択してください。');
                    return;
                }

                let opponentPieceIndex = -1;
                for (let i = stack.length - 2; i >= 0; i--) {
                    if (stack[i] !== currentPlayer) { opponentPieceIndex = i; break; }
                }

                if (opponentPieceIndex !== -1) {
                    this.currentTurnState.board[r][c].splice(opponentPieceIndex, 1);
                    this.turnActions.push({ type: 'eliminate', r, c });
                    this.setMessage(`${currentPlayer === 'white' ? '白' : '黒'}が相手の駒を排除しました。`);
                    this.uiGameState = 'ACTION_TAKEN';
                    this.render();
                } else {
                    this.setMessage('そのマスには排除できる相手の駒がありません。');
                }
            }

            selectPiece(r, c) {
                this.uiGameState = 'PIECE_SELECTED';
                this.selectedCoords = { r, c };
                this.setMessage('移動先を選択してください。');
                this.render();
            }

            deselect() {
                this.uiGameState = this.lastMoveDest ? 'CONTINUOUS_MOVE' : 'IDLE';
                this.selectedCoords = null;
                this.setMessage('');
                this.render();
            }

            getValidMoves(r, c) {
                const moves = [];
                const directions = [[-1, 0], [1, 0], [0, -1], [0, 1]];
                for (const [dr, dc] of directions) {
                    const newR = r + dr, newC = c + dc;
                    if (newR >= 0 && newR < this.boardSize && newC >= 0 && newC < this.boardSize) {
                        moves.push({ r: newR, c: newC });
                    }
                }
                return moves;
            }

            promptForPieceCount(startR, startC, endR, endC) {
                const { board, currentPlayer } = this.currentTurnState;
                const stack = board[startR][startC];
                let movablePiecesCount = 0;
                for (let i = stack.length - 1; i >= 0; i--) {
                    if (stack[i] === currentPlayer) movablePiecesCount++;
                    else break;
                }

                let maxMovable = movablePiecesCount;
                if (this.lastMoveDest) maxMovable = movablePiecesCount - 1;

                if (maxMovable <= 0) {
                    this.setMessage('連続移動では、自分の駒を1つ残す必要があります。');
                    this.deselect();
                    return;
                }

                if (maxMovable === 1) {
                    this.move(startR, startC, endR, endC, 1);
                    return;
                }

                let options = '';
                for (let i = 1; i <= maxMovable; i++) {
                    const selected = i === maxMovable ? 'selected' : '';
                    options += `<option value="${i}" ${selected}>${i}個</option>`;
                }

                const modalContent = `
                    <p>移動する駒の数を選択してください。</p>
                    <select id="piece-count-select" class="w-full border p-2 rounded mt-2 bg-white text-lg">${options}</select>
                `;

                this.showModal('移動する駒の数', modalContent, () => {
                    const pieceCount = parseInt(document.getElementById('piece-count-select').value, 10);
                    if (pieceCount > 0 && pieceCount <= maxMovable) {
                        this.move(startR, startC, endR, endC, pieceCount);
                    }
                });
            }

            cancelTurn() {
                this.setMessage('操作をキャンセルしました。');
                this.resetUncommittedChanges();
                this.render();
            }

            // ───────────── ターン確定（simulateTurn による検証 → 指し直し対応で moves に反映） ─────────────
            endTurn() {
                if (this.turnActions.length === 0 ||
                    JSON.stringify(this.turnStartBoardState) === JSON.stringify(this.currentTurnState.board)) {
                    this.setMessage('変更がありません。実質的なパスは禁止されています。');
                    return;
                }
                this.commitTurnLocally(this.turnActions);
            }

            /**
             * simulateTurn でアクションを検証し、成功したら moves 配列へ反映する。
             * 表示中の局面（viewingIndex）が末尾でない場合は、以降の変化を切り詰めてから
             * push する（＝指し直し・上書き）。これがユーザー承認済みの仕様。
             */
            commitTurnLocally(actions) {
                const committed = this.viewingState();
                const stateForSim = {
                    board: normalizeBoard(committed.board, this.boardSize),
                    summonCounts: { ...committed.summonCounts },
                    currentPlayer: committed.currentPlayer,
                    boardSize: this.boardSize,
                };

                let result;
                try {
                    result = simulateTurn(stateForSim, actions);
                } catch (err) {
                    this.setMessage(err.message || '不正な手です。');
                    this.resetUncommittedChanges();
                    this.render();
                    return;
                }

                const mover = committed.currentPlayer;
                const nextPlayer = mover === 'white' ? 'black' : 'white';

                const nextSnapshot = {
                    board: result.board, // simulateTurn は denormalized board を返す
                    summonCounts: result.summonCounts,
                    currentPlayer: nextPlayer,
                };

                // 指し直し: viewingIndex より後ろの局面を切り詰めてから新しい局面を追加する。
                this.moves = this.moves.slice(0, this.viewingIndex + 1);
                this.moves.push(nextSnapshot);
                this.viewingIndex = this.moves.length - 1;

                this.status = 'in_progress';
                this.winner = null;
                this.winReason = null;

                const nextNormalizedBoard = normalizeBoard(result.board, this.boardSize);
                const stateForWin = {
                    board: nextNormalizedBoard,
                    summonCounts: result.summonCounts,
                    currentPlayer: nextPlayer,
                    boardSize: this.boardSize,
                };
                if (checkWinCondition(stateForWin, { maxSummons: this.maxSummons, boardSize: this.boardSize })) {
                    const winner = mover;
                    const loser = nextPlayer;
                    const winnerLabel = winner === 'white' ? '白' : '黒';
                    const loserLabel = loser === 'white' ? '白' : '黒';
                    this.status = 'completed';
                    this.winner = winner;
                    this.winReason = `${winnerLabel}の勝利！${loserLabel}に合法手がなくなりました。`;
                }

                // 局面が変わったので進行中の解析は停止し、パネルをクリアする。
                this.stopAnalysis();

                this.resetUncommittedChanges();
                this.setMessage(this.status === 'completed' ? this.winReason : '');
                this.render();
            }

            // ───────────── 解析パネル（Phase 5・Worker結線） ─────────────
            startAnalysis() {
                if (this.analyzing) return;
                const state = this.viewingState();
                this.analyzing = true;
                this.analysisRequestId++;
                this.lastAnalysisDepth = null;
                this.lastAnalysisElapsed = null;
                this.lastAnalysisCurrent = null;
                this.lastAnalysisCandidates = [];
                this.renderAnalysisPanel();
                this.renderAnalysisControls();

                this.analysisWorker.postMessage({
                    requestId: this.analysisRequestId,
                    cmd: 'analyze',
                    state: {
                        board: state.board,
                        summonCounts: state.summonCounts,
                        currentPlayer: state.currentPlayer,
                        boardSize: this.boardSize,
                    },
                    netPath: ANALYSIS_NET_PATH,
                    maxDepth: 64,
                    topN: 3,
                });
            }

            stopAnalysis() {
                if (this.analyzing) {
                    this.analysisWorker.postMessage({ requestId: this.analysisRequestId, cmd: 'stop' });
                }
                this.analyzing = false;
                this.clearPreview();
                this.renderAnalysisControls();
                this.updateEvalBar(); // 静的評価へ戻す
            }

            handleAnalysisMessage(data) {
                const { requestId, cmd } = data;
                if (requestId !== this.analysisRequestId) return; // 古い解析結果は無視

                if (cmd === 'progress') {
                    this.lastAnalysisDepth = data.round;
                    this.lastAnalysisElapsed = data.info ? data.info.elapsedMs : null;
                    this.lastAnalysisCurrent = data.current;
                    this.lastAnalysisCandidates = data.candidates || [];
                    this.renderAnalysisPanel();
                    // ラウンドが進むごとに評価バーを探索由来の動的評価で更新する。
                    this.updateEvalBar();
                    return;
                }

                if (cmd === 'done') {
                    this.analyzing = false;
                    this.lastAnalysisDepth = data.round;
                    this.lastAnalysisElapsed = data.info ? data.info.elapsedMs : this.lastAnalysisElapsed;
                    this.renderAnalysisPanel();
                    this.renderAnalysisControls();
                    this.updateEvalBar(); // 静的評価へ戻す
                    return;
                }

                if (cmd === 'error') {
                    this.analyzing = false;
                    console.error('analysisWorker returned error:', data.error);
                    this.setMessage('解析エラーが発生しました: ' + data.error);
                    this.renderAnalysisControls();
                    return;
                }
            }

            // 候補手プレビュー: ホバー/クリックでその手を指した後の board を一時的に盤上表示する。
            setPreview(candidate) {
                this.previewCandidate = candidate;
                this.renderBoard();
            }

            clearPreview() {
                if (!this.previewCandidate) return;
                this.previewCandidate = null;
                this.renderBoard();
            }

            // ───────────── モーダル（nnue-lab.html の showModal を移植） ─────────────
            showModal(title, content, onConfirm, options = {}) {
                const { confirmLabel = 'OK', cancelLabel = null, onCancel = null } = options;
                dom.modalTitle.textContent = title;
                dom.modalContent.innerHTML = content || '';

                const newButton = dom.modalBtn.cloneNode(true);
                dom.modalBtn.parentNode.replaceChild(newButton, dom.modalBtn);
                dom.modalBtn = newButton;
                dom.modalBtn.textContent = confirmLabel;
                dom.modalBtn.onclick = () => {
                    this.hideModal();
                    if (onConfirm) onConfirm();
                };

                const newCancelButton = dom.modalCancelBtn.cloneNode(true);
                dom.modalCancelBtn.parentNode.replaceChild(newCancelButton, dom.modalCancelBtn);
                dom.modalCancelBtn = newCancelButton;
                if (cancelLabel) {
                    dom.modalCancelBtn.textContent = cancelLabel;
                    dom.modalCancelBtn.classList.remove('hidden');
                    dom.modalCancelBtn.onclick = () => { this.hideModal(); if (onCancel) onCancel(); };
                } else {
                    dom.modalCancelBtn.classList.add('hidden');
                }

                dom.modal.classList.remove('hidden');
                requestAnimationFrame(() => {
                    dom.modal.classList.remove('opacity-0', 'scale-95');
                });
            }

            hideModal() {
                dom.modal.classList.add('opacity-0', 'scale-95');
                setTimeout(() => dom.modal.classList.add('hidden'), 300);
            }

            setMessage(msg) {
                dom.messageArea.textContent = msg || '';
            }

            // ───────────── 描画 ─────────────
            render() {
                this.renderBoard();
                this.renderInfoPanel();
                this.renderControls();
                this.renderKifu();
                this.renderReplayControls();
                this.updateEvalBar();
            }

            renderBoard() {
                const boardSize = this.boardSize;
                dom.board.innerHTML = '';
                dom.board.style.gridTemplateColumns = `repeat(${boardSize}, 1fr)`;
                dom.board.style.gridTemplateRows = `repeat(${boardSize}, 1fr)`;

                // プレビュー中はその候補手の後の局面を表示する（下書きより優先）。
                const boardData = this.previewCandidate
                    ? normalizeBoard(this.previewCandidate.board, boardSize)
                    : this.currentTurnState.board;

                const validTargets = (!this.previewCandidate && this.uiGameState === 'PIECE_SELECTED' && this.selectedCoords)
                    ? this.getValidMoves(this.selectedCoords.r, this.selectedCoords.c)
                    : [];

                for (let r = 0; r < boardSize; r++) {
                    for (let c = 0; c < boardSize; c++) {
                        const cell = document.createElement('div');
                        cell.dataset.r = r; cell.dataset.c = c;
                        cell.className = `cell ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;

                        if (!this.previewCandidate && this.selectedCoords && this.selectedCoords.r === r && this.selectedCoords.c === c) {
                            cell.classList.add('selected');
                        }
                        if (validTargets.some(m => m.r === r && m.c === c)) {
                            cell.classList.add('valid-move');
                        }

                        const stack = Array.isArray(boardData[r]?.[c]) ? boardData[r][c] : [];
                        stack.forEach((pieceColor, i) => {
                            const piece = document.createElement('div');
                            piece.className = `piece ${pieceColor}`;
                            piece.style.transform = `translateY(${-i * 8}px)`;
                            piece.style.zIndex = i + 1;
                            cell.appendChild(piece);
                        });

                        dom.board.appendChild(cell);
                    }
                }
            }

            renderInfoPanel() {
                const { currentPlayer } = this.currentTurnState;
                const playerLabel = currentPlayer === 'white' ? '白' : '黒';

                if (this.status === 'completed') {
                    dom.turnIndicator.textContent = this.winReason || '対局終了';
                } else {
                    dom.turnIndicator.textContent = `${playerLabel}の手番（両手番とも手動操作）`;
                }

                dom.whiteSummonCount.textContent = `召喚 ${this.currentTurnState.summonCounts.white} / ${this.maxSummons}`;
                dom.blackSummonCount.textContent = `召喚 ${this.currentTurnState.summonCounts.black} / ${this.maxSummons}`;

                dom.viewingPastNotice.textContent = this.isViewingLatest()
                    ? ''
                    : 'この局面から指し直しています（操作すると以降の変化を上書きします）。';
            }

            renderControls() {
                const interactive = this.status === 'in_progress';

                const isSummonPhaseOver = this.currentTurnState.summonCounts.white === this.maxSummons &&
                    this.currentTurnState.summonCounts.black === this.maxSummons;

                dom.actionModeToggle.classList.toggle('hidden', !(interactive && isSummonPhaseOver && this.uiGameState !== 'ACTION_TAKEN'));

                const hasUncommittedAction = this.turnActions.length > 0;
                dom.cancelBtn.classList.toggle('hidden', !(interactive && hasUncommittedAction));
                dom.endTurnBtn.classList.toggle('hidden', !(interactive && hasUncommittedAction));
            }

            // 2つの盤面を比較して棋譜トークンを生成する（game.html の diffToNotation と同一ロジック、
            // 実体は coords.js から import した純関数を使う）。
            buildKifuHTML() {
                const moves = this.moves;
                const boardSize = this.boardSize;
                const halfMoves = [];
                for (let i = 1; i < moves.length; i++) {
                    halfMoves.push(diffToNotation(moves[i - 1].board, moves[i].board, boardSize));
                }

                const parts = [];
                for (let i = 0; i < halfMoves.length; i += 2) {
                    const turnNumber = i / 2 + 1;
                    parts.push(`<span class="kifu-turn-num">${turnNumber}.</span>`);
                    parts.push(`<span class="kifu-move" data-half-index="${i}">${halfMoves[i] || ''}</span>`);
                    if (halfMoves[i + 1] !== undefined) {
                        parts.push(`<span class="kifu-move" data-half-index="${i + 1}">${halfMoves[i + 1]}</span>`);
                    }
                }
                return parts.join(' ');
            }

            // halfMoves[k] は moves[k+1] の盤面を生んだ手に対応するため、
            // 現在表示中の viewingIndex に追従させるにはインデックスを1つずらす。
            renderKifu() {
                dom.kifuText.innerHTML = this.buildKifuHTML();
                const activeIndex = this.viewingIndex - 1;
                const activeEl = dom.kifuText.querySelector(`.kifu-move[data-half-index="${activeIndex}"]`);
                if (activeEl) {
                    activeEl.classList.add('kifu-active');
                    activeEl.scrollIntoView({ block: 'nearest', inline: 'center' });
                }
            }

            renderReplayControls() {
                const maxTurn = this.moves.length - 1;
                dom.turnDisplay.textContent = `Turn ${this.viewingIndex} / ${maxTurn}`;
                dom.firstMoveBtn.disabled = this.viewingIndex === 0;
                dom.prevMoveBtn.disabled = this.viewingIndex === 0;
                dom.nextMoveBtn.disabled = this.viewingIndex === maxTurn;
                dom.lastMoveBtn.disabled = this.viewingIndex === maxTurn;
            }

            // ───────────── 評価バー ─────────────
            // 解析中は探索由来の動的評価（ラウンドが進むごとに深くなる）を優先表示し、
            // 非解析時はメインスレッドの静的評価（1局面の即時評価）を表示する。
            updateEvalBar() {
                // 解析中: analysisWorker の progress が返す白勝率（whiteWinProb）で更新する。
                // プレビュー中でも解析対象局面の評価を保つため、盤面（currentTurnState）ではなく
                // 直近の解析結果を用いる。
                if (this.analyzing && this.lastAnalysisCurrent &&
                    typeof this.lastAnalysisCurrent.whiteWinProb === 'number') {
                    const prob = this.lastAnalysisCurrent.whiteWinProb;
                    const round = this.lastAnalysisDepth;
                    dom.evalBarWhite.style.width = `${(prob * 100).toFixed(1)}%`;
                    dom.evalBarLabel.textContent =
                        `白勝率: ${(prob * 100).toFixed(1)}%（探索R${round ?? '-'}）`;
                    return;
                }

                // 非解析時: 静的評価（nnue-lab.html を踏襲）。
                // 構築初期（newGame→stopAnalysis）では currentTurnState 未初期化のため何もしない。
                if (!this.currentTurnState) return;
                const state = {
                    board: this.currentTurnState.board,
                    summonCounts: this.currentTurnState.summonCounts,
                    currentPlayer: this.currentTurnState.currentPlayer,
                    boardSize: this.boardSize,
                };

                const net = this.resolvedEvalNets[ANALYSIS_NET_PATH];
                if (net) {
                    // 白視点の生スコア（logit）→ シグモイドで白勝率へ
                    const whiteLogit = net.evaluateState(state, 'white');
                    const prob = 1 / (1 + Math.exp(-whiteLogit));
                    dom.evalBarWhite.style.width = `${(prob * 100).toFixed(1)}%`;
                    dom.evalBarLabel.textContent = `白勝率: ${(prob * 100).toFixed(1)}%（静的）`;
                    return;
                }
                this.ensureEvalNetLoaded();
                dom.evalBarLabel.textContent = '読込中…';
            }

            ensureEvalNetLoaded() {
                if (this._evalNetLoading === ANALYSIS_NET_PATH) return; // 二重ロード防止
                this._evalNetLoading = ANALYSIS_NET_PATH;
                loadEvalNet(ANALYSIS_NET_PATH)
                    .then((net) => {
                        this.resolvedEvalNets[ANALYSIS_NET_PATH] = net;
                        this._evalNetLoading = null;
                        this.updateEvalBar();
                    })
                    .catch((err) => {
                        this._evalNetLoading = null;
                        console.error('評価バー用NNUEロード失敗:', err);
                        dom.evalBarLabel.textContent = 'NNUE読込エラー';
                    });
            }

            // ───────────── 解析パネル描画 ─────────────
            renderAnalysisControls() {
                dom.analyzeStartBtn.classList.toggle('hidden', this.analyzing);
                dom.analyzeStopBtn.classList.toggle('hidden', !this.analyzing);
            }

            renderAnalysisPanel() {
                dom.analysisDepth.textContent = this.lastAnalysisDepth ?? '-';
                dom.analysisElapsed.textContent = this.lastAnalysisElapsed ?? '-';

                if (this.lastAnalysisCurrent) {
                    const { score, winProb } = this.lastAnalysisCurrent;
                    dom.analysisCurrentScore.textContent = typeof score === 'number' ? score.toFixed(2) : '-';
                    dom.analysisCurrentWinprob.textContent = typeof winProb === 'number' ? `${(winProb * 100).toFixed(1)}%` : '-';
                } else {
                    dom.analysisCurrentScore.textContent = '-';
                    dom.analysisCurrentWinprob.textContent = '-';
                }

                const candidates = this.lastAnalysisCandidates || [];
                dom.candidatesList.innerHTML = '';
                if (candidates.length === 0) {
                    dom.candidatesList.innerHTML = '<p class="text-xs text-gray-400">解析結果はまだありません。「解析開始」を押してください。</p>';
                    return;
                }

                candidates.forEach((cand, idx) => {
                    const row = document.createElement('div');
                    row.className = 'candidate-row flex items-center justify-between' + (cand.isWin ? ' is-win' : '');
                    const scoreText = typeof cand.score === 'number' ? cand.score.toFixed(2) : String(cand.score);
                    const winProbText = typeof cand.winProb === 'number' ? `${(cand.winProb * 100).toFixed(1)}%` : '-';
                    row.innerHTML = `
                        <span class="font-mono">${idx + 1}. ${cand.notation}${cand.isWin ? '<span class="win-badge">即勝ち</span>' : ''}</span>
                        <span class="text-sm text-gray-600">score ${scoreText} / 勝率 ${winProbText}</span>
                    `;
                    row.addEventListener('mouseenter', () => this.setPreview(cand));
                    row.addEventListener('mouseleave', () => this.clearPreview());
                    row.addEventListener('click', () => this.setPreview(cand));
                    dom.candidatesList.appendChild(row);
                });
            }
        }

        const tool = new AnalysisTool();
        // デバッグ用にコンソールから状態を確認できるようにする
        window.__analysisTool = tool;
    </script>
</body>
</html>
